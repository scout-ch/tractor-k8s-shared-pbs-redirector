---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: pbs-redirector
  namespace: pbs-redirector
spec:
  interval: 10m
  chart: pbs-redirector
  sourceRef:
    kind: GitRepository
    name: pbs-redirector
  valuesFiles:
    - values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pbs-redirector
  namespace: pbs-redirector
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: pbs-redirector
    namespace: pbs-redirector
