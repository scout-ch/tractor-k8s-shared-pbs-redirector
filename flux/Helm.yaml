---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: pbs-redirector
  namespace: pbs-redirector
spec:
  interval: 10m
  url: https://github.com/scout-ch/tractor-k8s-shared-pbs-redirector
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmChart
metadata:
  name: pbs-redirector
  namespace: pbs-redirector
spec:
  interval: 10m
  chart: pbs-redirector
  sourceRef:
    kind: HelmRepository
    name: pbs-redirector
  valuesFiles:
    - values.yaml
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pbs-redirector
  namespace: pbs-redirector
spec:
  interval: 10m
  chartRef:
    kind: HelmChart
    name: pbs-redirector
    namespace: pbs-redirector
